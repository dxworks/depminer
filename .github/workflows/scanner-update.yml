name: Scanner Update

# Daily bump of the bundled scanners; scanner-release.yml then releases it. Needs secret SCANNER_BOT_TOKEN and auto-merge.

on:
  schedule:
    - cron: '0 5 * * *'   # daily 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-update
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Check bot token
        run: |
          if [ -z "${{ secrets.SCANNER_BOT_TOKEN }}" ]; then
            echo "::error::SCANNER_BOT_TOKEN is not set (see the header of this workflow)"; exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.SCANNER_BOT_TOKEN }}
          persist-credentials: false   # create-pull-request takes the token itself

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # The pinned Trivy compares the vulnerabilities of the pinned and the candidate binaries.
      - name: Read the pinned Trivy
        id: pins
        run: echo "trivy=$(sed -n 's/^TRIVY_VERSION="\(.*\)"$/\1/p' scripts/prepare-release-voyager.sh)" >> "$GITHUB_OUTPUT"

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v${{ steps.pins.outputs.trivy }}

      - name: Bump pins
        id: bump
        run: ./scripts/bump-scanners.sh
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_AGE_DAYS: '7'

      - name: Set up Java
        if: steps.bump.outputs.changed == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 21
          distribution: 'temurin'

      # Builds the real Voyager bundle (downloads all 10 binaries and checks each against the new
      # checksums), then runs both wrappers from it on a small fixture: the new binaries must start
      # and still find packages offline.
      - name: Smoke-test the new binaries
        if: steps.bump.outputs.changed == 'true'
        run: |
          ./mvnw -B -q package -DskipTests
          ./scripts/prepare-release-voyager.sh 0.0.0-check
          fx="$RUNNER_TEMP/target/fixture"; out="$RUNNER_TEMP/out"
          mkdir -p "$fx"
          cat > "$fx/package-lock.json" <<'EOF'
          {"name":"fixture","version":"1.0.0","lockfileVersion":3,"requires":true,
           "packages":{"":{"name":"fixture","version":"1.0.0","dependencies":{"lodash":"4.17.21"}},
           "node_modules/lodash":{"version":"4.17.21","resolved":"https://registry.npmjs.org/lodash/-/lodash-4.17.21.tgz"}}}
          EOF
          bash depminer/bin/syft-wrapper.sh  "$RUNNER_TEMP/target" "$out/syft"  "$out"
          bash depminer/bin/trivy-wrapper.sh "$RUNNER_TEMP/target" "$out/trivy" "$out"
          for f in "$out"/syft/*.cdx.json "$out"/trivy/*.trivy.cdx.json; do
            n=$(jq '[.components[]? | select(.name == "lodash")] | length' "$f")
            echo "$f: lodash entries = $n"
            [ "$n" -ge 1 ] || { echo "::error::$f does not list lodash"; exit 1; }
          done

      - name: Open PR
        id: pr
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.SCANNER_BOT_TOKEN }}
          branch: bot-scanner-update   # no "/": build.yml only runs on branches matching "*"
          delete-branch: true
          add-paths: |
            scripts/prepare-release-voyager.sh
            docs/tools.md
          commit-message: '[BOT] Bump bundled scanners: ${{ steps.bump.outputs.summary }}'
          title: '[BOT] Bump bundled scanners: ${{ steps.bump.outputs.summary }}'
          body: |
            ${{ steps.bump.outputs.summary }}

            ${{ steps.bump.outputs.notes }}

            - Newest stable releases at least 7 days old, or newer when that fixes a vulnerability of the pinned version.
            - Checksums taken from each publisher's checksums file after its Sigstore signature verified against the publisher's release workflow.
            - The Voyager bundle was built with them (every download checked) and both wrappers found packages in a fixture.

            Merges itself when the required checks pass, unless the new version adds a HIGH/CRITICAL finding. Once merged, Scanner Release tags the next patch version (x.y.Z+1) and publishes it.

      - name: Report a blocked bump
        if: steps.pr.outputs.pull-request-number != '' && steps.bump.outputs.blocked == 'true'
        run: |
          gh pr merge --disable-auto "${{ steps.pr.outputs.pull-request-url }}" || true   # set by an earlier run
          echo "::warning::New HIGH/CRITICAL in the candidate; ${{ steps.pr.outputs.pull-request-url }} left for review"
        env:
          GH_TOKEN: ${{ secrets.SCANNER_BOT_TOKEN }}

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number != '' && steps.bump.outputs.blocked != 'true'
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-url }}"
        env:
          GH_TOKEN: ${{ secrets.SCANNER_BOT_TOKEN }}
