name: Scanner Release

# Tags the next patch release after a bot bump, if nothing else is unreleased.

on:
  push:
    branches: [main]
    paths:
      - scripts/prepare-release-voyager.sh

permissions:
  contents: read

concurrency:
  group: scanner-release
  cancel-in-progress: false

jobs:
  tag:
    if: startsWith(github.event.head_commit.message, '[BOT] Bump bundled scanners:')
    runs-on: ubuntu-latest
    steps:
      # Tags pushed with the bot token (not GITHUB_TOKEN) so they start the release workflows.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.SCANNER_BOT_TOKEN }}
          fetch-depth: 0

      - name: Tag next patch release
        run: |
          last="$(git tag -l 'v*-voyager' --sort=-v:refname | head -1)"
          [ -n "$last" ] || { echo "::error::no previous v*-voyager tag"; exit 1; }
          others="$(git log --format=%s "$last"..HEAD | grep -v '^\[BOT\] Bump bundled scanners:' || true)"
          if [ -n "$others" ]; then
            echo "::notice::Not releasing: main has unreleased changes besides scanner bumps:"
            echo "$others"
            exit 0
          fi
          base="${last#v}"; base="${base%-voyager}"
          IFS=. read -r major minor patch <<< "$base"
          next="${major}.${minor}.$((patch + 1))"
          for t in "v${next}" "v${next}-voyager"; do
            if git rev-parse -q --verify "refs/tags/$t" >/dev/null; then
              echo "::error::tag $t already exists"; exit 1
            fi
          done
          git tag "v${next}"
          git tag "v${next}-voyager"
          git push origin "v${next}" "v${next}-voyager"
          echo "Tagged v${next} and v${next}-voyager"
