on:
  push:
    tags:
      - 'v*-voyager'

name: Create Voyager Release

jobs:
  parse-tag:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.parse.outputs.semver }}
    steps:
      - name: Extract Semver
        id: parse
        run: |
          semver=${TAG#"refs/tags/v"}
          semver=${semver%"-voyager"}
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.ref }}

  gate:
    needs: parse-tag
    uses: dxworks/pipelines/.github/workflows/release-gate.yml@v1
    with:
      java-version: '21'

  archive:
    needs: [parse-tag, gate]
    uses: dxworks/pipelines/.github/workflows/release-archive.yml@v1
    with:
      version: ${{ needs.parse-tag.outputs.semver }}
      java-version: '21'
      prepare-script: ./scripts/prepare-release-voyager.sh

  sign-macos:
    needs: archive
    runs-on: macos-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Download archive
        uses: actions/download-artifact@v4
        with:
          name: release-archive

      - name: Sign and notarize the macOS trivy binaries
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          # App Store Connect API team key (role Developer) for the notary service.
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERT_P12_BASE64" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::warning::macOS signing secrets not set; the macOS trivy binaries ship unsigned by us (Aqua's ad-hoc signature only)."
            exit 0
          fi

          unzip -q depminer-voyager.zip
          bins=(depminer/bin/trivy-darwin-amd64 depminer/bin/trivy-darwin-arm64)

          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          # Pinned SHA-256 of Apple's DeveloperIDG2CA.cer (valid until 2031-09-17); a fresh runner may lack this intermediate.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $RUNNER_TEMP/DeveloperIDG2CA.cer" | shasum -a 256 -c -
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple: -k "$kc_pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          identity="$(security find-identity -v -p codesigning "$keychain" | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
          if [ -z "$identity" ]; then echo "::error::No 'Developer ID Application' identity in the certificate."; exit 1; fi

          # trivy is a plain Go CLI: no entitlements needed under the hardened runtime.
          for b in "${bins[@]}"; do
            codesign --force --options runtime --timestamp --identifier com.aquasecurity.trivy --sign "$identity" "$b"
            codesign --verify --strict --verbose=2 "$b"
          done

          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
          notary_auth=(--key "$RUNNER_TEMP/notary-key.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")

          mkdir "$RUNNER_TEMP/notarize"
          cp "${bins[@]}" "$RUNNER_TEMP/notarize/"
          ditto -c -k "$RUNNER_TEMP/notarize" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${notary_auth[@]}" \
            --wait --timeout 2h --output-format json | tee "$RUNNER_TEMP/notary.json"
          status="$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json" 2>/dev/null || true)"
          if [ "$status" != "Accepted" ]; then
            id="$(plutil -extract id raw -o - "$RUNNER_TEMP/notary.json" 2>/dev/null || true)"
            [ -n "$id" ] && xcrun notarytool log "$id" "${notary_auth[@]}" || true
            echo "::error::Notarization status: ${status:-unknown}"
            exit 1
          fi

          # Repack; zip keeps the exec bits that voyenv relies on.
          rm depminer-voyager.zip
          zip -r -X -q depminer-voyager.zip depminer
          unzip -Z depminer-voyager.zip 'depminer/bin/*' | grep -E 'trivy|syft|\.sh'

      - name: Remove signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/cert.p12"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: release-archive-signed
          path: depminer-voyager.zip
          if-no-files-found: error

  github-release:
    needs: [parse-tag, sign-macos]
    permissions:
      contents: write
    uses: dxworks/pipelines/.github/workflows/release-github.yml@v1
    with:
      artifact-name: release-archive-signed
      version: ${{ needs.parse-tag.outputs.semver }}
      tag: v${{ needs.parse-tag.outputs.semver }}-voyager
      release-name: Depminer ${{ needs.parse-tag.outputs.semver }} (Voyager)
      asset-name: depminer-voyager.zip
      release-notes-file: releaseNotes/v${{ needs.parse-tag.outputs.semver }}.md
